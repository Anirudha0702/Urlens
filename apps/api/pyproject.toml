[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "brevo-python>=5.1.0",
    "fastapi>=0.146.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
[project.scripts]
dev = "uvicorn app.main:app --reload --port 8000"
lint = "ruff check ."
test = "pytest"
